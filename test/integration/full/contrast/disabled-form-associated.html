<!doctype html>
<html lang="en">
  <head>
    <title>color-contrast disabled form-associated custom element test</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="/node_modules/mocha/mocha.css"
    />
    <script src="/node_modules/mocha/mocha.js"></script>
    <script src="/node_modules/chai/chai.js"></script>
    <script src="/axe.js"></script>
    <script>
      mocha.setup({
        timeout: 10000,
        ui: 'bdd'
      });
      var assert = chai.assert;
    </script>
    <script src="/test/integration/no-ui-reporter.js"></script>
  </head>
  <body>
    <script>
      if (!customElements.get('cc-form-associated-control')) {
        customElements.define(
          'cc-form-associated-control',
          class extends HTMLElement {
            static formAssociated = true;
            connectedCallback() {
              if (!this.shadowRoot) {
                this.attachShadow({ mode: 'open' }).innerHTML =
                  '<span id="shadow-text" style="color:#cccccc;background:#ffffff">Shadow text</span>';
              }
            }
          }
        );
        customElements.define(
          'cc-non-form-associated-control',
          class extends HTMLElement {}
        );
      }
    </script>
    <div id="fixture" style="background-color: #ffffff">
      <cc-form-associated-control
        id="disabled-host"
        disabled
        style="color: #cccccc; background-color: #ffffff"
      >
        Disabled host text
      </cc-form-associated-control>
      <cc-form-associated-control
        id="disabled-shadow-host"
        disabled
      ></cc-form-associated-control>
      <cc-form-associated-control
        id="enabled-host"
        style="color: #cccccc; background-color: #ffffff"
      >
        Enabled host text
      </cc-form-associated-control>
      <cc-form-associated-control
        id="enabled-shadow-host"
      ></cc-form-associated-control>
      <cc-non-form-associated-control
        id="non-form-associated-disabled"
        disabled
        style="color: #cccccc; background-color: #ffffff"
      >
        Not form-associated
      </cc-non-form-associated-control>
    </div>
    <script src="/test/testutils.js"></script>
    <script src="disabled-form-associated.js"></script>
    <script src="/test/integration/adapter.js"></script>
  </body>
</html>
