<!doctype html>
<html lang="en">
  <head>
    <title>aria-labelledby referencing a slot in shadow DOM (issue 4335)</title>
    <meta charset="utf8" />
    <link
      rel="stylesheet"
      type="text/css"
      href="/node_modules/mocha/mocha.css"
    />
    <script src="/node_modules/mocha/mocha.js"></script>
    <script src="/node_modules/chai/chai.js"></script>
    <script src="/axe.js"></script>
    <script>
      mocha.setup({
        timeout: 10000,
        ui: 'bdd'
      });
      var assert = chai.assert;
    </script>
  </head>
  <body>
    <main id="mocha"></main>
    <div id="host"></div>
    <script>
      // Reproduce issue #4335: a <section> whose aria-labelledby points at a
      // <slot> inside the same shadow root. The slot is not tracked in axe's
      // virtual tree, which used to throw "Cannot read properties of undefined
      // (reading 'props')" while computing the section's accessible name.
      var host = document.getElementById('host');
      var shadowRoot = host.attachShadow({ mode: 'open' });
      shadowRoot.innerHTML =
        '<section id="target" aria-labelledby="foo"></section><slot id="foo"></slot>';
    </script>
    <script src="/test/testutils.js"></script>
    <script src="aria-labelledby-slot.js"></script>
    <script src="/test/integration/adapter.js"></script>
  </body>
</html>
