name: Create performance report

on:
  workflow_dispatch:
    inputs:
      version:
        description: The axe-core version to run against (e.g., latest, next, 4.11.0)
        default: 'next'

jobs:
  run_perf:
    name: Run performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Deps
        uses: ./.github/actions/install-deps
        id: install-deps
        with:
          start-xvfb: ${{ env.DISPLAY }}
      - name: Fetch requested axe-core version
        id: download
        run: |
          Req='${{ github.event.inputs.version }}'

          # If the input starts with a digit, treat as a pinned semver; otherwise
          # resolve as a dist-tag by hitting the registry directly. Going through
          # `pnpm add` can use a stale tag from pnpm's cache, so fetch the tarball
          # straight from the registry instead of installing
          if [[ "$Req" =~ ^[0-9] ]]; then
            Requested="$Req"
          else
            Requested=$(curl -sSf https://registry.npmjs.org/-/package/axe-core/dist-tags | jq -re ".\"$Req\"")
          fi
          echo "Resolved axe-core@$Req -> $Requested"

          # Pull axe.js and package.json out of the version's tarball
          Tarball=$(curl -sSf "https://registry.npmjs.org/axe-core/$Requested" | jq -re .dist.tarball)
          Tmp=$(mktemp -d)
          curl -sSfL "$Tarball" | tar -xz -C "$Tmp" package/axe.js package/package.json
          cp "$Tmp/package/axe.js" ./axe.js
          AxeVersion=$(jq -r .version "$Tmp/package/package.json")

          # Ensure we pulled the right version
          if [ "$AxeVersion" != "$Requested" ]; then
            echo "::error::Requested $Requested but tarball contains $AxeVersion"
            exit 1
          fi

          echo "axe_version=$AxeVersion" >> "$GITHUB_OUTPUT"
      - name: Run tracking script
        env:
          WTR_BROWSER: chrome
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm perf:report ${{ steps.download.outputs.axe_version }}
      - name: Upload tracking JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'perf-v${{ steps.download.outputs.axe_version }}'
          path: ./perf/reports/v${{ steps.download.outputs.axe_version }}.json
          retention-days: 90
      - name: Open PR
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          AXE_VERSION: ${{ steps.download.outputs.axe_version }}
        run: |
          git config user.name "API Team CI User"
          git config user.email "aciattestteamci@deque.com"

          Branch="perf-v${AXE_VERSION}"
          echo "Branch: $Branch"
          git checkout -b "$Branch"

          git add perf/reports/v${AXE_VERSION}.json
          git commit -m "perf: add tracking file for v${AXE_VERSION}"
          git push origin "$Branch" --force

          gh pr create \
              --title "perf: add tracking file for v${AXE_VERSION}" \
              --body "This PR was opened by a robot :robot: :tada:" \
              --base develop
