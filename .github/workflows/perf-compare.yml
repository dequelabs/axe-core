name: Compare performance

on:
  pull_request:
    branches:
      - master
      - develop
      - 'release-*'
    paths:
      - 'lib/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf-base:
    name: Perf (base)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This workflow is advisory — infra flakes (build, artifact upload,
    # runner failure) shouldn't red-X the PR's check status
    continue-on-error: true
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Install Deps
        uses: ./.github/actions/install-deps
        id: install-deps
        with:
          start-xvfb: ${{ env.DISPLAY }}
      - name: Build axe.js
        run: pnpm run build
      - name: Run perf report
        env:
          WTR_BROWSER: chrome
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm perf:report base
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-base
          path: perf/reports/base.json
          retention-days: 14

  perf-head:
    name: Perf (head)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Deps
        uses: ./.github/actions/install-deps
        id: install-deps
        with:
          start-xvfb: ${{ env.DISPLAY }}
      - name: Build axe.js
        run: pnpm run build
      - name: Run perf report
        env:
          WTR_BROWSER: chrome
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm perf:report head
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-head
          path: perf/reports/head.json
          retention-days: 14

  compare:
    name: Compare and comment
    needs: [perf-base, perf-head]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download base report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: perf-base
          path: perf/reports
      - name: Download head report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: perf-head
          path: perf/reports
      - name: Generate comment markdown (axe only)
        run: node perf/compare.js --axe-only perf/reports/base.json perf/reports/head.json > /tmp/perf-compare-comment.md
      - name: Generate summary markdown (all metrics)
        run: node perf/compare.js --all perf/reports/base.json perf/reports/head.json > /tmp/perf-compare-summary.md
      - name: Write to step summary
        run: cat /tmp/perf-compare-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate history line
        run: node perf/compare.js --history-line "${{ github.event.pull_request.head.sha }}" perf/reports/base.json perf/reports/head.json > /tmp/perf-compare-history-line.md
      # Fork PRs run this workflow with a read-only GITHUB_TOKEN, so the
      # comment API returns 403. Skip the step rather than fail loudly —
      # the step summary still shows the diff.
      - name: Post or update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Marker line lets us find the previous run's comment and update it
          # in place instead of stacking a new comment per push. --paginate
          # so we don't miss the comment on PRs with 30+ existing comments.
          Marker='<!-- perf-compare-report -->'
          HistoryStart='<!-- history-start -->'
          HistoryEnd='<!-- history-end -->'
          MaxHistoryEntries=10

          CommentId=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$Marker\"))][0].id")

          # Carry forward the history section from the previous comment
          # (bounded by HTML-comment markers), then append this run's entry
          # and truncate to the last N so the comment doesn't grow forever.
          ExistingHistory=""
          if [ -n "$CommentId" ] && [ "$CommentId" != "null" ]; then
            ExistingBody=$(gh api "repos/$REPO/issues/comments/$CommentId" --jq '.body')
            ExistingHistory=$(printf '%s\n' "$ExistingBody" \
              | sed -n "/$HistoryStart/,/$HistoryEnd/p" \
              | sed "/$HistoryStart/d; /$HistoryEnd/d")
          fi
          UpdatedHistory=$(printf '%s\n%s\n' "$ExistingHistory" "$(cat /tmp/perf-compare-history-line.md)" \
            | grep -v '^$' \
            | tail -n "$MaxHistoryEntries")

          {
            echo "$Marker"
            echo
            cat /tmp/perf-compare-comment.md
            echo
            echo '<details><summary>Run history</summary>'
            echo
            echo "$HistoryStart"
            echo "$UpdatedHistory"
            echo "$HistoryEnd"
            echo
            echo '</details>'
          } > /tmp/perf-compare-body.md

          if [ -n "$CommentId" ] && [ "$CommentId" != "null" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$CommentId" \
              -F body=@/tmp/perf-compare-body.md
          else
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/perf-compare-body.md
          fi
