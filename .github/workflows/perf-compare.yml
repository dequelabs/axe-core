name: Compare performance

on:
  pull_request:
    branches:
      - master
      - develop
      - 'release-*'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf-base:
    name: Perf (base)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Install Deps
        uses: ./.github/actions/install-deps
        id: install-deps
        with:
          start-xvfb: ${{ env.DISPLAY }}
      - name: Build axe.js
        run: pnpm run build
      - name: Run perf report
        env:
          WTR_BROWSER: chrome
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm perf:report base
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-base
          path: perf/reports/base.json
          retention-days: 14

  perf-head:
    name: Perf (head)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Deps
        uses: ./.github/actions/install-deps
        id: install-deps
        with:
          start-xvfb: ${{ env.DISPLAY }}
      - name: Build axe.js
        run: pnpm run build
      - name: Run perf report
        env:
          WTR_BROWSER: chrome
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm perf:report head
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-head
          path: perf/reports/head.json
          retention-days: 14

  compare:
    name: Compare and comment
    needs: [perf-base, perf-head]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download base report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: perf-base
          path: perf/reports
      - name: Download head report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: perf-head
          path: perf/reports
      - name: Generate comment markdown (axe only)
        run: node perf/compare.js --axe-only perf/reports/base.json perf/reports/head.json > /tmp/perf-compare-comment.md
      - name: Generate summary markdown (all metrics)
        run: node perf/compare.js --all perf/reports/base.json perf/reports/head.json > /tmp/perf-compare-summary.md
      - name: Write to step summary
        run: cat /tmp/perf-compare-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Marker line lets us find the previous run's comment and update it
          # in place instead of stacking a new comment per push
          Marker='<!-- perf-compare-report -->'
          {
            echo "$Marker"
            echo
            cat /tmp/perf-compare-comment.md
          } > /tmp/perf-compare-body.md

          CommentId=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$Marker\"))][0].id")

          if [ -n "$CommentId" ] && [ "$CommentId" != "null" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$CommentId" \
              -F body=@/tmp/perf-compare-body.md
          else
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/perf-compare-body.md
          fi
