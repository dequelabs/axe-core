name: Compare performance

on:
  pull_request:
    branches:
      - master
      - develop
      - 'release-*'
    paths:
      - 'lib/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Cheap ~5s pre-check so we can *skip* (not fail) the expensive perf job
  # when head doesn't have the perf infra. `continue-on-error` on the perf
  # job only affects workflow-level status — a failed job still shows red on
  # the PR checks list. A skipped job shows grey and doesn't count against
  # the PR, which is what we actually want here.
  preflight:
    name: Check perf infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-perf: ${{ steps.check.outputs.has-perf }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Query the file via the API instead of doing a full checkout —
          # takes ~1s and avoids paying for a runner slot on skipped PRs
          if gh api "repos/$REPO/contents/perf/report.js?ref=$HEAD_SHA" --silent 2>/dev/null; then
            echo "has-perf=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Head does not contain the perf infrastructure — skipping perf comparison"
            echo "has-perf=false" >> "$GITHUB_OUTPUT"
          fi

  perf:
    name: Perf comparison
    needs: preflight
    if: needs.preflight.outputs.has-perf == 'true'
    runs-on: ubuntu-latest
    # Doubled from 60 (previous parallel-job limit) since we now measure
    # base and head sequentially on one runner
    timeout-minutes: 120
    # Keeps the workflow-level status green when the perf steps hit an
    # infra flake (build, artifact upload, runner failure). The head-lacks-
    # perf-infra case is now handled by the preflight `if:` above so it
    # skips cleanly instead of showing a failed job.
    continue-on-error: true
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Need base's history so we can swap in its lib/ after the head run
          fetch-depth: 0
      - name: Install Deps
        uses: ./.github/actions/install-deps
        id: install-deps
        with:
          start-xvfb: ${{ env.DISPLAY }}

      # --- Head measurement ---
      - name: Build axe.js (head)
        run: pnpm run build
      - name: Run perf report (head)
        env:
          WTR_BROWSER: chrome
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm perf:report head

      # --- Base measurement ---
      # Swap only lib/ to base — perf/report.js, perf/sites/, and
      # perf/compare.js all stay at head so both measurements use the same
      # measurement code. This means base is really "base's lib built with
      # head's build tooling," which is what we want to measure axe changes.
      - name: Swap to base lib
        run: git checkout ${{ github.event.pull_request.base.sha }} -- lib/
      - name: Build axe.js (base)
        run: pnpm run build
      - name: Run perf report (base)
        env:
          WTR_BROWSER: chrome
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm perf:report base

      # --- Comparison ---
      - name: Generate comment markdown (axe only)
        run: node perf/compare.js --axe-only --base-label "${{ github.event.pull_request.base.sha }}" --head-label "${{ github.event.pull_request.head.sha }}" perf/reports/base.json perf/reports/head.json > /tmp/perf-compare-comment.md
      - name: Generate summary markdown (all metrics)
        run: node perf/compare.js --all --base-label "${{ github.event.pull_request.base.sha }}" --head-label "${{ github.event.pull_request.head.sha }}" perf/reports/base.json perf/reports/head.json > /tmp/perf-compare-summary.md
      - name: Write to step summary
        run: cat /tmp/perf-compare-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-reports
          # actions/upload-artifact uses glob patterns, not shell brace expansion
          path: |
            perf/reports/base.json
            perf/reports/head.json
          retention-days: 14

      # Fork PRs run this workflow with a read-only GITHUB_TOKEN, so the
      # comment API returns 403. Skip the step rather than fail loudly —
      # the step summary still shows the diff.
      - name: Post PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr comment "$PR" --repo "$REPO" --body-file /tmp/perf-compare-comment.md
