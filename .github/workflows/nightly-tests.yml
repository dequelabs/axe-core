name: Nightly Tests

on:
  schedule:
    # Runs every day at 2:17 AM UTC
    # Schedules should try to be offset from common times
    # to avoid high contention times on GitHub runners.
    - cron: '17 2 * * *'
  workflow_dispatch:

env:
  CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISPLAY: ':99'
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Dependencies
        id: install-deps
        uses: ./.github/actions/install-deps
        with:
          nightly: 'true'
          start-xvfb: ${{ env.DISPLAY }}
      - &build
        name: Build
        id: build
        run: pnpm run build
      - name: Run Firefox Nightly Browser Tests
        env:
          WTR_BROWSER: firefox-nightly
          FIREFOX_NIGHTLY_BIN: ${{ steps.install-deps.outputs.firefox-path }}
        run: pnpm run test
      - name: Run Chrome Beta Browser Tests
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        env:
          WTR_BROWSER: chrome
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm run test
  act:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - &install-deps
        name: Install Deps
        id: install-deps
        uses: ./.github/actions/install-deps
      - *build
      # Builds are allowed wholesale because `allowBuilds` keys on a resolved
      # commit, which a floating branch install cannot know ahead of time.
      - name: Install Latest WCAG ACT Rules
        run: pnpm add --config.dangerouslyAllowAllBuilds=true github:w3c/wcag-act-rules#main
      - name: Run ACT Tests
        env:
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm run test:act
  aria-practices:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - *checkout
      - *install-deps
      - *build
      # See the ACT job above for why builds are allowed wholesale here.
      - name: Install Latest W3C Aria Practices
        run: pnpm add --config.dangerouslyAllowAllBuilds=true github:w3c/aria-practices#main
      - name: Run ARIA Practices Tests
        env:
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm run test:apg
